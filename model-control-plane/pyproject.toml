[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sentinelaegisforge-control-plane"
version = "0.1.0"
description = "Offline dataset contracts for the SentinelAegisForge model control plane"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "deltalake==1.6.6",
  "pandas==3.0.6",
  "pyarrow==25.0.1",
  "scikit-learn==1.9.1",
  "mlflow==3.17.0",
]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.13.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelaegisforge_control_plane"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

# PyArrow ships no typing marker/stubs. Keep our code strict; validate its boundary
# through exact Arrow schemas and runtime tests rather than adding another dependency.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# Pandas and sklearn publish no typing markers/stubs in these pinned wheels.
# Keep strict checks for project code and exercise this boundary in tests.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
