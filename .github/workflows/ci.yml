name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scala:
    name: Scala foundation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streaming-engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Check formatting, compile, and test
        run: sbt scalafmtCheckAll compile test

  python:
    name: Python foundation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-control-plane
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          enable-cache: true
      - name: Synchronize locked dependencies
        run: uv sync --locked --group dev
      - name: Run tests
        run: uv run --locked pytest
      - name: Run lint checks
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Run static type checks
        run: uv run --locked mypy src tests
